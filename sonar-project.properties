# SonarQube Cloud — analise estatica do codigo da suite.
#
# projectKey e organization precisam existir na conta antes do primeiro run.
# Enquanto o secret SONAR_TOKEN nao estiver configurado, o job se auto-pula.
sonar.projectKey=IgorRoberth_saucelab
sonar.organization=igorroberth
sonar.projectName=Swag Labs E2E
sonar.projectVersion=1.0.0

# O repositorio nao tem src/main: todo o codigo vive em src/test/java. Declarar
# isso como sonar.tests faria o Sonar aplicar so o subconjunto de regras de
# codigo de teste e ignorar as regras de manutenibilidade que interessam aqui —
# Page Object mal desenhado e code smell como qualquer outro.
sonar.sources=src/test/java
sonar.java.binaries=target/test-classes
sonar.java.source=21
sonar.sourceEncoding=UTF-8

# Sem relatorio de cobertura: cobrir codigo de teste com teste nao tem sentido.
sonar.coverage.exclusions=**/*
