# Pipeline espelhada. Mesma suite, sem nada especifico de plataforma: a distincao
# permitida pela secao 9 do .cursorrules e o retry por variavel, e mais nada.
#
# Roda so no schedule semanal — o GitHub Actions e a CI principal; duplicar cada
# push nas duas plataformas gastaria o dobro por zero informacao nova.

stages:
  - contract
  - test

default:
  image: mcr.microsoft.com/playwright/java:v1.62.0-noble
  interruptible: true
  tags:
    - docker

variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  MAVEN_CLI_OPTS: '-B --no-transfer-progress'

cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'web'

contrato:
  stage: contract
  image: bash:5
  script:
    - bash .github/scripts/contract-lint.sh

.e2e:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests install
    - mvn $MAVEN_CLI_OPTS test -D browser=$BROWSER -D surefire.rerunFailingTestsCount=2
    - mvn $MAVEN_CLI_OPTS allure:report
  artifacts:
    # when: always — num run verde a evidencia e o que prova a execucao.
    when: always
    expire_in: 7 days
    paths:
      - target/allure-report/
      - target/evidencias/
    reports:
      junit: target/surefire-reports/TEST-*.xml

chromium:
  extends: .e2e
  variables:
    BROWSER: chromium

firefox:
  extends: .e2e
  variables:
    BROWSER: firefox

webkit:
  extends: .e2e
  variables:
    BROWSER: webkit
