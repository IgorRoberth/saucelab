name: Sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Execucao manual: sem isto, so da para reexecutar um run existente, o que
  # obriga a inventar um commit toda vez que se mexe na configuracao do Sonar.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # O Sonar usa o historico para atribuir cada issue ao commit que a
          # introduziu; com clone raso todo issue vira "novo".
          fetch-depth: 0

      - name: Verificar se o token chegou
        # Teste no shell, e nao `if: env.SONAR_TOKEN != ''`: o contexto env em
        # condicao de passo nao e confiavel quando o valor vem de secret, e a
        # suite inteira ficava pulada sem dizer por que.
        id: token
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "presente=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN encontrado (${#SONAR_TOKEN} caracteres)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN ausente ou vazio." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configurar JDK 21
        if: steps.token.outputs.presente == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar o codigo de teste
        # O scanner precisa dos .class para analisar Java: sem sonar.java.binaries
        # apontando para diretorio existente ele aborta.
        if: steps.token.outputs.presente == 'true'
        run: mvn -B -q test-compile

      - name: Analisar
        if: steps.token.outputs.presente == 'true'
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Avisar que o Sonar esta desligado
        if: steps.token.outputs.presente == 'false'
        run: |
          {
            echo "## Sonar nao executado"
            echo ""
            echo "O secret \`SONAR_TOKEN\` nao esta configurado no repositorio."
            echo "Crie o projeto em https://sonarcloud.io e adicione o token em"
            echo "Settings > Secrets and variables > Actions."
          } >> "$GITHUB_STEP_SUMMARY"
