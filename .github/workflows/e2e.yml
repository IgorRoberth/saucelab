name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Regressao contra o ambiente publico — segunda, quarta e sexta, 06:00 UTC.
    # Tres medicoes por semana, nao carga: a secao 10 do .cursorrules proibe carga
    # contra o alvo de terceiro, e um run por dia util alternado nao chega perto disso.
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      browser:
        description: Browser da execucao
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all
      tests:
        description: 'Filtro de classe (ex.: AuthenticationTest). Vazio roda a suite completa.'
        type: string
        default: ''

# Um push novo cancela a execucao anterior do mesmo ref: feedback rapido vale
# mais que terminar um run ja obsoleto. O event_name entra no grupo porque
# execucao agendada tambem roda em main: sem ele um push cancelaria o run das
# 06:00 no meio, e com tres agendamentos por semana isso deixa de ser raro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Contrato de arquitetura
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar regras do .cursorrules
        run: bash .github/scripts/contract-lint.sh

  browsers:
    name: Definir browsers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          choice="${{ inputs.browser }}"
          if [ -z "$choice" ] || [ "$choice" = "all" ]; then
            echo 'matrix=["chromium","firefox","webkit"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$choice\"]" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.browser }}
    needs: browsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Um browser vermelho nao pode esconder o resultado dos outros dois.
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.browsers.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Descobrir a versao do Playwright
        id: playwright
        run: |
          version=$(sed -n 's|.*<playwright.version>\(.*\)</playwright.version>.*|\1|p' pom.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache dos binarios do Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # A versao do Playwright, e nao o hash do pom: o binario do browser so
          # muda quando ela muda. Com hashFiles('pom.xml') qualquer edicao no pom
          # — uma propriedade nova, um bump do Dependabot — jogava fora o cache e
          # forcava o download dos tres browsers de novo.
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Compilar
        run: mvn -B -DskipTests install

      - name: Instalar browser
        run: mvn -B exec:java -D exec.args="install --with-deps ${{ matrix.browser }}"

      - name: Executar suite
        # RETRIES=2 apenas aqui: retry local esconderia bug real durante o desenvolvimento.
        run: >
          mvn -B test
          -D browser=${{ matrix.browser }}
          -D surefire.rerunFailingTestsCount=2
          ${{ inputs.tests && format('-D test={0}', inputs.tests) || '' }}

      - name: Gerar relatorio Allure
        # Sem este passo o artefato sai como JSON cru: o allure-results nao e um
        # relatorio, e so o CLI transforma ele em HTML navegavel.
        if: always()
        run: mvn -B allure:report

      - name: Resumo da execucao
        if: always()
        run: |
          {
            echo "## ${{ matrix.browser }}"
            echo ""
            echo "| Suite | Testes | Falhas | Erros | Ignorados |"
            echo "|---|--:|--:|--:|--:|"
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "| _nenhum relatorio gerado_ | | | | |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for report in "${reports[@]}"; do
            suite=$(sed -n 's/^Test set: .*\.//p' "$report")
            stats=$(grep -m1 '^Tests run:' "$report")
            run=$(echo "$stats" | sed -n 's/.*Tests run: \([0-9]*\).*/\1/p')
            failures=$(echo "$stats" | sed -n 's/.*Failures: \([0-9]*\).*/\1/p')
            errors=$(echo "$stats" | sed -n 's/.*Errors: \([0-9]*\).*/\1/p')
            skipped=$(echo "$stats" | sed -n 's/.*Skipped: \([0-9]*\).*/\1/p')
            echo "| $suite | $run | $failures | $errors | $skipped |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Anexar o JSON intermediario da agregacao
        # Nao e artefato de consumo: e o JSON cru do Allure, com nomes em UUID,
        # que o job de publicacao precisa dos tres browsers para agregar. Quem
        # quer evidencia legivel usa evidencia-<browser> ou o relatorio no Pages.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intermediario-nao-use-${{ matrix.browser }}
          path: target/allure-results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Anexar evidencia
        # Sempre: num run verde a evidencia e o que prova a execucao, e sem isto
        # o allure-results morre com o runner.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ matrix.browser }}
          path: |
            target/allure-report/
            target/evidencias/
            target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Publicar relatorio
    needs: [browsers, test]
    # always(): um run vermelho e justamente quando o relatorio importa mais.
    # Pull request nao publica: o Pages tem um endereco so, e PR sobrescreveria main.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Baixar os resultados dos tres browsers
        uses: actions/download-artifact@v4
        with:
          pattern: intermediario-nao-use-*
          path: target/allure-results
          merge-multiple: true

      - name: Recuperar o historico do relatorio publicado
        # Os quatro graficos de tendencia (tendencia, duracoes, categorias e
        # tentativas) sao desenhados a partir da pasta history do relatorio
        # anterior. Ela vive no Pages, nao no repositorio: sem trazer de volta,
        # cada run gera um relatorio sem memoria e os quatro ficam vazios.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          pages="https://$owner.github.io/${{ github.event.repository.name }}"
          echo "PAGES_URL=$pages" >> "$GITHUB_ENV"

          mkdir -p target/allure-results/history
          for file in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            # Baixa para um temporario e so promove no sucesso: um JSON truncado
            # dentro de history/ quebra a geracao do relatorio inteiro.
            temporary=$(mktemp)
            if curl -fsSL --retry 2 "$pages/history/$file" -o "$temporary"; then
              mv "$temporary" "target/allure-results/history/$file"
            else
              rm -f "$temporary"
              echo "sem $file no relatorio anterior — esperado no primeiro run"
            fi
          done

      - name: Identificar a execucao no historico
        # Sem executor.json cada ponto da tendencia e um numero solto. Com ele o
        # ponto vira link para o run que o produziu.
        run: |
          cat > target/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Swag Labs E2E",
            "buildOrder": ${{ github.run_number }},
            "buildName": "#${{ github.run_number }} - ${{ github.ref_name }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "$PAGES_URL"
          }
          EOF

      - name: Ajustar o ambiente do relatorio agregado
        # Os tres artefatos trazem o mesmo environment.properties com um Browser
        # diferente cada, e o merge preserva so o ultimo. No agregado a informacao
        # honesta e a matriz inteira, mais o commit que originou o run.
        run: |
          file=target/allure-results/environment.properties
          [ -f "$file" ] || : > "$file"
          grep -v '^Browser=' "$file" > "$file.tmp" || true
          mv "$file.tmp" "$file"
          {
            echo "Browsers=${{ join(fromJSON(needs.browsers.outputs.matrix), ', ') }}"
            echo "Commit=${{ github.sha }}"
          } >> "$file"

      - name: Instalar o Allure CLI
        # O zip do Maven Central, e nao o pacote npm: o npm publica uma linha de
        # versoes propria e atrasada (parou no 2.43.0), entao a versao pinada no
        # pom nao existe la. Este e o mesmo artefato que o allure-maven baixa.
        run: |
          version=$(grep -o '<allure.commandline.version>[^<]*' pom.xml | head -1 | cut -d'>' -f2)
          base=https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline
          curl -fsSL --retry 3 "$base/$version/allure-commandline-$version.zip" -o "$RUNNER_TEMP/allure.zip"
          unzip -q "$RUNNER_TEMP/allure.zip" -d "$HOME/allure"
          echo "$HOME/allure/allure-$version/bin" >> "$GITHUB_PATH"
          "$HOME/allure/allure-$version/bin/allure" --version

      - name: Gerar relatorio agregado
        # O CLI direto, e nao mvn allure:report: o plugin do Maven sobrescreve o
        # executor.json dos results pelo seu proprio ("Maven", sem buildOrder).
        # Sem buildOrder os quatro graficos de tendencia ficam sem eixo e o Allure
        # desenha "nao ha nada para mostrar", mesmo com o historico no lugar.
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Empacotar para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          # Nome por tentativa: "Re-run failed jobs" nao apaga o artefato da
          # tentativa anterior, e dois artefatos com o mesmo nome no mesmo run
          # fazem o deploy-pages abortar sem saber qual publicar.
          name: github-pages-${{ github.run_attempt }}
          path: target/allure-report

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
